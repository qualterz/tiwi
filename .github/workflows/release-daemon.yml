name: Release Daemon

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-daemon
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be semver X.Y.Z (got: $VERSION)" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: tiwi.exe
            native: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: tiwi
            native: true
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: tiwi
            native: true
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: tiwi
            native: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
          key: ${{ matrix.target }}

      - name: Stamp version in Cargo.toml
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: perl -0777 -i -pe 's/^version = ".*?"/version = "$ENV{VERSION}"/m' daemon/Cargo.toml

      - name: Run unit tests
        if: matrix.native
        run: cargo test --manifest-path daemon/Cargo.toml

      - name: Build release binary
        run: cargo build --manifest-path daemon/Cargo.toml --release --target ${{ matrix.target }}

      - name: Smoke test binary
        if: matrix.native
        shell: bash
        run: |
          BIN="daemon/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          "$BIN" --version
          "$BIN" --help

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: daemon/target/${{ matrix.target }}/release/${{ matrix.bin }}
          retention-days: 3

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bins/

      - name: Generate default config and package archives
        run: |
          chmod +x \
            bins/bin-x86_64-unknown-linux-gnu/tiwi \
            bins/bin-aarch64-apple-darwin/tiwi \
            bins/bin-x86_64-apple-darwin/tiwi

          ./bins/bin-x86_64-unknown-linux-gnu/tiwi --default-config > config.toml

          mkdir -p release
          zip -j release/tiwi-windows-x64.zip bins/bin-x86_64-pc-windows-msvc/tiwi.exe config.toml
          tar -czf release/tiwi-linux-x64.tar.gz -C bins/bin-x86_64-unknown-linux-gnu tiwi -C "$PWD" config.toml
          tar -czf release/tiwi-macos-arm64.tar.gz -C bins/bin-aarch64-apple-darwin tiwi -C "$PWD" config.toml
          tar -czf release/tiwi-macos-x64.tar.gz -C bins/bin-x86_64-apple-darwin tiwi -C "$PWD" config.toml

      - name: Generate SHA256SUMS.txt
        working-directory: release
        run: sha256sum tiwi-* > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" \
            release/* \
            --title "Tiwi ${{ needs.prepare.outputs.tag }}" \
            --generate-notes

  publish-npm:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Stamp version and stage publish to npm
        working-directory: daemon/npm
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm install -g npm@latest
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          npm stage publish --provenance --access public
