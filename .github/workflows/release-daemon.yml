name: Release Daemon

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-daemon
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          RAW="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          VERSION="${RAW#v}"
          TAG="v${VERSION}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be semver X.Y.Z (got: $VERSION)" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-x64
            rust_targets: x86_64-pc-windows-msvc
            obs_suffix: windows-x64.zip
          - os: ubuntu-24.04
            preset: ubuntu-x86_64
            rust_targets: x86_64-unknown-linux-gnu
            obs_suffix: linux-x64.tar.gz
          - os: macos-latest
            preset: macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            obs_suffix: macos-universal.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      TIWI_VERSION: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      OBS_ARCHIVE: tiwi-obs-${{ needs.prepare.outputs.version }}-${{ matrix.obs_suffix }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      COPYFILE_DISABLE: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            daemon -> ../target
            obs/rust -> ../../target
          key: ${{ matrix.preset }}

      - name: Install Linux OBS & Qt6 dependencies
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libobs-dev qt6-base-dev libgl1-mesa-dev

      - name: Cache OBS dependencies
        if: runner.os != 'Linux'
        uses: actions/cache@v6
        with:
          path: obs/.deps
          key: obs-deps-${{ matrix.preset }}-${{ hashFiles('obs/buildspec.json') }}

      - name: Run unit tests
        run: |
          cargo test --manifest-path daemon/Cargo.toml
          cargo test --manifest-path obs/rust/Cargo.toml

      - name: Build and package daemon
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            cargo build --manifest-path daemon/Cargo.toml --release --target aarch64-apple-darwin
            cargo build --manifest-path daemon/Cargo.toml --release --target x86_64-apple-darwin
            ./target/aarch64-apple-darwin/release/tiwi --version
            ./target/aarch64-apple-darwin/release/tiwi --help
            ./target/aarch64-apple-darwin/release/tiwi --default-config > config.toml
            tar -czf "dist/tiwi-${VERSION}-macos-arm64.tar.gz" -C target/aarch64-apple-darwin/release tiwi -C "$PWD" config.toml
            tar -czf "dist/tiwi-${VERSION}-macos-x64.tar.gz" -C target/x86_64-apple-darwin/release tiwi -C "$PWD" config.toml
          else
            cargo build --manifest-path daemon/Cargo.toml --release
            if [ "${{ runner.os }}" = "Windows" ]; then
              ./target/release/tiwi.exe --version
              ./target/release/tiwi.exe --help
              ./target/release/tiwi.exe --default-config > config.toml
              pwsh -NoProfile -Command "Compress-Archive -Path target/release/tiwi.exe, config.toml -DestinationPath dist/tiwi-${VERSION}-windows-x64.zip"
            else
              ./target/release/tiwi --version
              ./target/release/tiwi --help
              ./target/release/tiwi --default-config > config.toml
              tar -czf "dist/tiwi-${VERSION}-linux-x64.tar.gz" -C target/release tiwi -C "$PWD" config.toml
            fi
          fi

      - name: Configure and build OBS plugin
        working-directory: obs
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      - name: Package OBS plugin
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mkdir -p staging/obs/tiwi-obs/data
            cp obs/build_x64/RelWithDebInfo/tiwi-obs.dll staging/obs/tiwi-obs/
            cp -r obs/data/. staging/obs/tiwi-obs/data/
            pwsh -NoProfile -Command "Compress-Archive -Path staging/obs/tiwi-obs -DestinationPath dist/${OBS_ARCHIVE}"
            dotnet tool install --global wix --version 5.*
            export PATH="$HOME/.dotnet/tools:$PATH"
            MSI_VERSION="${VERSION%%-*}"
            wix build obs/installer/tiwi-obs.wxs -arch x64 -d Version="$MSI_VERSION" -d StageDir="staging/obs/tiwi-obs" -o "dist/tiwi-obs-windows-x64.msi"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            mkdir -p staging/obs/tiwi-obs/bin/64bit staging/obs/tiwi-obs/data
            cp obs/build_x86_64/tiwi-obs.so staging/obs/tiwi-obs/bin/64bit/
            cp -r obs/data/. staging/obs/tiwi-obs/data/
            tar -czf "dist/${OBS_ARCHIVE}" -C staging/obs tiwi-obs
          else
            tar -czf "dist/${OBS_ARCHIVE}" -C obs/build_macos/RelWithDebInfo tiwi-obs.plugin
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.preset }}
          path: dist/
          retention-days: 3

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true
          path: release

      - name: Generate SHA256SUMS.txt
        working-directory: release
        run: sha256sum tiwi-* > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" \
            release/* \
            --target "${{ github.sha }}" \
            --title "Tiwi ${{ needs.prepare.outputs.tag }}" \
            --generate-notes

  publish-npm:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Stamp version and stage publish to npm
        working-directory: daemon/npm
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm install -g npm@latest
          npm pkg set version="$VERSION"
          npm stage publish --provenance --access public
