name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-daemon
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be semver X.Y.Z (got: $VERSION)" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-x64
            rust_targets: x86_64-pc-windows-msvc
            obs_archive: tiwi-obs-windows-x64.zip
          - os: ubuntu-latest
            preset: ubuntu-x86_64
            rust_targets: x86_64-unknown-linux-gnu
            obs_archive: tiwi-obs-linux-x64.tar.gz
          - os: macos-latest
            preset: macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            obs_archive: tiwi-obs-macos-universal.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      TIWI_VERSION: ${{ needs.prepare.outputs.tag }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            daemon -> target
            obs/rust -> target
          key: ${{ matrix.preset }}

      - name: Install Linux OBS & Qt6 dependencies
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libobs-dev qt6-base-dev libgl1-mesa-dev

      - name: Cache OBS dependencies
        if: runner.os != 'Linux'
        uses: actions/cache@v4
        with:
          path: obs/.deps
          key: obs-deps-${{ matrix.preset }}-${{ hashFiles('obs/buildspec.json') }}

      - name: Stamp version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          perl -0777 -i -pe 's/^version = ".*?"/version = "$ENV{VERSION}"/m' daemon/Cargo.toml obs/rust/Cargo.toml
          node -e '
            const fs = require("fs");
            const spec = JSON.parse(fs.readFileSync("obs/buildspec.json", "utf8"));
            spec.version = process.env.VERSION;
            fs.writeFileSync("obs/buildspec.json", JSON.stringify(spec, null, 2) + "\n");
          '

      - name: Run unit tests
        run: |
          cargo test --manifest-path daemon/Cargo.toml
          cargo test --manifest-path obs/rust/Cargo.toml

      - name: Build daemon (Windows / Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cargo build --manifest-path daemon/Cargo.toml --release
          mkdir -p dist/bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/release/tiwi.exe --version
            ./target/release/tiwi.exe --help
            cp target/release/tiwi.exe dist/bin/tiwi-windows-x64.exe
          else
            ./target/release/tiwi --version
            ./target/release/tiwi --help
            cp target/release/tiwi dist/bin/tiwi-linux-x64
          fi

      - name: Build daemon (macOS arm64 & x64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo build --manifest-path daemon/Cargo.toml --release --target aarch64-apple-darwin
          cargo build --manifest-path daemon/Cargo.toml --release --target x86_64-apple-darwin
          ./target/aarch64-apple-darwin/release/tiwi --version
          ./target/aarch64-apple-darwin/release/tiwi --help
          mkdir -p dist/bin
          cp target/aarch64-apple-darwin/release/tiwi dist/bin/tiwi-macos-arm64
          cp target/x86_64-apple-darwin/release/tiwi dist/bin/tiwi-macos-x64

      - name: Configure and build OBS plugin
        working-directory: obs
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      - name: Package Windows OBS plugin (OBS 33 flat layout)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/obs/tiwi-obs/data | Out-Null
          Copy-Item obs/build_x64/RelWithDebInfo/tiwi-obs.dll dist/obs/tiwi-obs/
          Copy-Item -Recurse obs/data/* dist/obs/tiwi-obs/data/
          Compress-Archive -Path dist/obs/tiwi-obs -DestinationPath dist/${{ matrix.obs_archive }}

      - name: Package Linux OBS plugin
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/obs/tiwi-obs/bin/64bit dist/obs/tiwi-obs/data
          cp obs/build_x86_64/tiwi-obs.so dist/obs/tiwi-obs/bin/64bit/
          cp -r obs/data/. dist/obs/tiwi-obs/data/
          tar -czf "dist/${{ matrix.obs_archive }}" -C dist/obs tiwi-obs

      - name: Package macOS OBS plugin bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.obs_archive }}" -C obs/build_macos/RelWithDebInfo tiwi-obs.plugin

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.preset }}
          path: |
            dist/bin/*
            dist/${{ matrix.obs_archive }}
          retention-days: 3

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: artifacts/

      - name: Generate default config and package archives
        run: |
          chmod +x \
            artifacts/build-ubuntu-x86_64/bin/tiwi-linux-x64 \
            artifacts/build-macos/bin/tiwi-macos-arm64 \
            artifacts/build-macos/bin/tiwi-macos-x64

          ./artifacts/build-ubuntu-x86_64/bin/tiwi-linux-x64 --default-config > config.toml

          mkdir -p release staging/win staging/linux staging/mac-arm64 staging/mac-x64
          cp artifacts/build-windows-x64/bin/tiwi-windows-x64.exe staging/win/tiwi.exe
          cp artifacts/build-ubuntu-x86_64/bin/tiwi-linux-x64 staging/linux/tiwi
          cp artifacts/build-macos/bin/tiwi-macos-arm64 staging/mac-arm64/tiwi
          cp artifacts/build-macos/bin/tiwi-macos-x64 staging/mac-x64/tiwi

          zip -j release/tiwi-windows-x64.zip staging/win/tiwi.exe config.toml
          tar -czf release/tiwi-linux-x64.tar.gz -C staging/linux tiwi -C "$PWD" config.toml
          tar -czf release/tiwi-macos-arm64.tar.gz -C staging/mac-arm64 tiwi -C "$PWD" config.toml
          tar -czf release/tiwi-macos-x64.tar.gz -C staging/mac-x64 tiwi -C "$PWD" config.toml

          cp artifacts/build-*/tiwi-obs-* release/

      - name: Generate SHA256SUMS.txt
        working-directory: release
        run: sha256sum tiwi-* > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" \
            release/* \
            --title "Tiwi ${{ needs.prepare.outputs.tag }}" \
            --generate-notes

  publish-npm:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Stamp version and stage publish to npm
        working-directory: daemon/npm
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm install -g npm@latest
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          npm stage publish --provenance --access public
