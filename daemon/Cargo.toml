[package]
name = "tiwi-daemon"
edition = "2024"

[lib]
name = "tiwi_daemon"
path = "src/lib.rs"

[[bin]]
name = "tiwi"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "whip"]
cli = [
    "dep:clap",
    "dep:clap-serde-derive",
    "dep:crossterm",
    "dep:dirs",
    "dep:toml",
    "dep:tracing-subscriber",
    "whip",
]
whip = ["dep:axum"]

[dependencies]
aes-gcm = "0.10"
axum = { version = "0.8", optional = true }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"], optional = true }
clap-serde-derive = { version = "1.0.0", optional = true }
crossterm = { version = "0.28", optional = true }
dirs = { version = "6", optional = true }
flate2 = "1"
hmac = "0.12"
rand = "0.8"
rumqttc = { version = "0.24", features = ["websocket", "use-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.5"
str0m = { version = "0.26", default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "time", "signal", "macros"] }
toml = { version = "0.8", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[target.'cfg(windows)'.dependencies]
str0m = { version = "0.26", default-features = false, features = ["wincrypto"] }

[target.'cfg(not(windows))'.dependencies]
str0m = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
