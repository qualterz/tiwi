[package]
name = "tiwi-daemon"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tiwi"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
clap-serde-derive = "1.0.0"
dirs = "6"
flate2 = "1"
hmac = "0.12"
rand = "0.8"
rumqttc = { version = "0.24", features = ["websocket", "use-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.5"
str0m = { version = "0.26", default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "time", "signal", "macros"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
str0m = { version = "0.26", default-features = false, features = ["wincrypto"] }

[target.'cfg(not(windows))'.dependencies]
str0m = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }

[profile.release]
strip = true
lto = "thin"
